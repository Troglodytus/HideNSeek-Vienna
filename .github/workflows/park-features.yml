name: Inspect official park features
on:
  push:
    branches: [feature/v3.13.7-park-area-filter]
    paths: [.github/park-feature-trigger.txt]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect park feature schemas
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,time
          base='https://data.wien.gv.at/daten/geo'
          for layer in ['PARKINFOOGD','OEFFGRUENFLOGD','OEFFGRUENPKTGOGD']:
            args={'service':'WFS','request':'GetFeature','version':'1.1.0','typeName':'ogdwien:'+layer,'srsName':'EPSG:4326','outputFormat':'json','maxFeatures':5}
            url=base+'?'+urllib.parse.urlencode(args)
            try:
              with urllib.request.urlopen(url,timeout=18) as r:data=r.read()
              obj=json.loads(data)
              features=obj.get('features',[])
              print(layer,'count',len(features),'meta',str(obj.get('totalFeatures')),flush=True)
              for f in features[:3]:print(json.dumps({'id':f.get('id'),'properties':f.get('properties'),'geometry_type':f.get('geometry',{}).get('type'),'geometry_start':str(f.get('geometry',{}).get('coordinates'))[:200]},ensure_ascii=False),flush=True)
            except Exception as e:print(layer,'FAILED',str(e)[:300],flush=True)
          PY
