name: Review v3.13.4 refinements
on:
  push:
    branches: [feature/v3.13.4-vor-cards-street-interchanges]
    paths: [.github/v3134-review-trigger.txt]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v3.13.4-vor-cards-street-interchanges
      - name: Apply review refinements
        run: python3 .github/v3134-review.py
      - name: Validate
        run: |
          node --check app.js
          grep -F "if(state.developerPreview||!q||!['seeker','hider'].includes(state.role))return;" app.js
          grep -F "manualStationOverrideRefs" app.js
          grep -F "if(!state.vorRenderTimer)state.vorRenderTimer=setInterval(()=>renderVorNavigation(),1000);" app.js
          grep -F "const APP_VERSION = '3.13.4';" app.js
          grep -F "same_line_prepare" app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "v3.13.4: harden VOR tracking and station aliases"
          git push origin HEAD:feature/v3.13.4-vor-cards-street-interchanges
