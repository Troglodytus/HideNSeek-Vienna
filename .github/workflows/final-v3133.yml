name: Final v3.13.3 review fixes
on:
  push:
    branches: [fix/v3.13.3-responsive-geometry]
    paths: [.github/v3133-final-trigger.txt]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v3.13.3-responsive-geometry
      - name: Apply final review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js');s=p.read_text()
          old="    const qs=effectiveActions('question').filter(q=>!phase||new Date(q.created_at).getTime()>phase).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(q=>[q.id,activeAnswerForQuestion(q.id)?.id||'',activeVetoForQuestion(q.id)?.id||'']);"
          new="    const qs=effectiveActions('question').filter(q=>!phase||new Date(q.created_at).getTime()>phase).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).map(q=>{const a=activeAnswerForQuestion(q.id);return[q.id,a?.id||'',a?.payload?.answer?.geometry_cache_key||'',activeVetoForQuestion(q.id)?.id||''];});"
          if s.count(old)!=1:raise SystemExit('possible-area signature anchor mismatch')
          s=s.replace(old,new,1)
          old="if(ready)possible=ready;else{state.heavyAreaPending=true;if(!state.heavyHistoryJobs.has(k)){const gameId=state.game?.id,job=(async()=>{await geometryIdleYield(250);return runGeometryWorker('difference_optimize',{a:possible,b:c,tolerance:0.00003,min_vertex_m:3},90000);})()"
          new="if(ready)possible=ready;else{state.heavyAreaPending=true;if(!state.heavyHistoryJobs.has(k)){const gameId=state.game?.id,domain=possible,job=(async()=>{await geometryIdleYield(250);return runGeometryWorker('difference_optimize',{a:domain,b:c,tolerance:0.00003,min_vertex_m:3},90000);})()"
          if s.count(old)!=1:raise SystemExit('auto-veto capture anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: node --check app.js
      - run: node --check geometry-worker.js
      - name: Validate review invariants
        run: |
          grep -F "a?.payload?.answer?.geometry_cache_key||''" app.js
          grep -F "gameId=state.game?.id,domain=possible" app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "v3.13.3: invalidate provisional geometry safely"
          git push origin HEAD:fix/v3.13.3-responsive-geometry
