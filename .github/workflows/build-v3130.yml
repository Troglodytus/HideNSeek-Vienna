name: Build v3.13.0 from v3.11.3

on:
  push:
    branches:
      - release/v3.13.0-from-v3.11.3
    paths:
      - .github/v313-build.py
      - .github/v313-trigger.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v3.13.0-from-v3.11.3
      - name: Patch exact v3.11.3 overlay anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/v313-build.py')
          s=p.read_text()
          s=s.replace('old="""    if(p.question_kind===\'tentacle\')','old="""if(p.question_kind===\'tentacle\')',1)
          s=s.replace('new="""    if(p.question_kind===\'tentacle\')','new="""if(p.question_kind===\'tentacle\')',1)
          p.write_text(s)
          PY
      - name: Restore v3.11.3 and apply v3.13.0 patch
        run: python3 .github/v313-build.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate patch invariants
        run: |
          grep -F "const APP_VERSION = '3.13.0';" app.js
          grep -F "slot:'station-interchange'" app.js
          grep -F "slot:'street-shape'" app.js
          grep -F "slot:'nearest-bus-line'" app.js
          grep -F "slot:'vor-navigation'" app.js
          grep -F "question_kind:'bus_line_tentacle'" app.js
          grep -F "question_kind:'vor_navigation'" app.js
          grep -F "sameLineExclusiveCorridor" app.js
          grep -F "vorNavigationPanel" index.html
          grep -F "Nearest Bus Line" supabase-v3.13.0-migration.sql
          grep -F "Current Street Shape" supabase-v3.13.0-migration.sql
          git diff --check
      - name: Commit v3.13.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css supabase-v3.13.0-migration.sql
          git commit -m "v3.13.0: restore v3.11.3 questions and add working Bus/VOR"
          git push origin HEAD:release/v3.13.0-from-v3.11.3
