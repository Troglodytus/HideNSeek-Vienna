name: Build v3.13.1 geometry cache

on:
  push:
    branches:
      - perf/v3.13.1-geometry-cache
    paths:
      - .github/v3131-patch.py
      - .github/workflows/build-v3131.yml
      - .github/v3131-trigger.txt

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, 'trigger v3.13.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/v3.13.1-geometry-cache
      - name: Apply patch
        run: python3 .github/v3131-patch.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate invariants
        run: |
          grep -F "const APP_VERSION = '3.13.1';" app.js
          grep -F "scheduleHeavyGeometryWarmups" app.js
          grep -F "possibleAreaStateSignature" app.js
          grep -F "constraint_geometry" app.js
          grep -F "domain_geometry" app.js
          grep -F "possibleRenderSignature" app.js
          grep -F "Current Street Shape" app.js
          grep -F "Nearest Bus Line" app.js
          grep -F "VOR Navigation" app.js
          git diff --check
      - name: Commit generated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "v3.13.1: cache and precompute heavy map geometry"
          git push origin HEAD:perf/v3.13.1-geometry-cache
