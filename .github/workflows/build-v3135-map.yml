name: Validate v3.13.5 map editor
on:
  push:
    branches: [feature/v3.13.5-players-rewards-traps]
    paths: [.github/v3135-map-trigger.txt]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v3.13.5-players-rewards-traps
      - name: Apply follow-up patch
        run: python3 .github/v3135-map-patch.py
      - name: JavaScript syntax
        run: node --check app.js
      - name: Validate A-G invariants
        run: |
          grep -F "questionDeckRefreshPending" app.js
          grep -F "Unlocks after 4 questions" app.js
          grep -F "Hider reward · Draw" app.js
          grep -F "player-location-marker" styles.css
          grep -F "Manual trigger: +" app.js
          grep -F "auto within 50 m" app.js
          grep -F "developerMapTab" index.html
          grep -F "Dynamic Vienna reference map" index.html
          grep -F "admin_save_map_item_v1" app.js
          grep -F "list_map_manual_items_v1" app.js
          grep -F "create table if not exists public.map_manual_items" supabase-v3.13.5-migration.sql
          grep -F "Manual trigger intentionally awards only the base value" supabase-v3.13.5-migration.sql
          grep -F "never to the legacy row which might currently belong to another Seeker" supabase-v3.13.5-migration.sql
          grep -F "same_line_prepare" app.js
          grep -F "heavyAreaPending" app.js
          grep -F "geometry-worker.js" app.js
          git diff --check
      - name: Commit production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css supabase-v3.13.5-migration.sql
          git commit -m "v3.13.5: dynamic map editor and trap rule fixes"
          git push origin HEAD:feature/v3.13.5-players-rewards-traps
