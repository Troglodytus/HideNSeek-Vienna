name: Validate v3.13.4 VOR freshness
on:
  push:
    branches: [feature/v3.13.4-vor-cards-street-interchanges]
    paths: [.github/v3134-vor-freshness-trigger.txt]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v3.13.4-vor-cards-street-interchanges
      - run: python3 .github/v3134-vor-freshness.py
      - run: |
          grep -F "updated_at>=now()-interval '20 seconds'" supabase-v3.13.4-migration.sql
          node --check app.js
          git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase-v3.13.4-migration.sql
          git commit -m "v3.13.4: ignore stale VOR GPS fixes"
          git push origin HEAD:feature/v3.13.4-vor-cards-street-interchanges
