name: Validate v3.12 semantic hotfix

on:
  push:
    branches:
      - feature/v3.12-bus-vor
    paths:
      - .github/hotfix-v312.py
      - .github/workflows/apply-v312.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.12-bus-vor
          fetch-depth: 0
      - name: Apply semantic hotfix
        run: python3 .github/hotfix-v312.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate expected changes
        run: |
          grep -q "same bus geometry" app.js
          grep -q "existingTransit?.busLines" app.js
          grep -q "Nearest Bus Line" app.js
          grep -q "VOR Navigation" app.js
          grep -q "answer_bus_line_tentacle_v1" supabase-v3.12.0-migration.sql
          grep -q "get_vor_navigation_bearing_v1" supabase-v3.12.0-migration.sql
          git diff --check
      - name: Commit semantic hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix: keep bus tentacle reference data shared"
          git push origin HEAD:feature/v3.12-bus-vor
