name: Build v3.13.3 responsive geometry

on:
  push:
    branches: [fix/v3.13.3-responsive-geometry]
    paths: [.github/v3133-trigger.txt]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/v3.13.3-responsive-geometry
      - name: Reset generated files to main
        run: git checkout origin/main -- app.js geometry-worker.js index.html
      - name: Apply patch
        run: python3 .github/v3133-patch.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check geometry-worker.js
      - name: Validate targeted invariants
        run: |
          grep -F "const APP_VERSION = '3.13.3';" app.js
          grep -F "subscribeRealtime(); startTimers();" app.js
          grep -F "same_line_prepare" app.js
          grep -F "same_line_apply" app.js
          grep -F "attach_answer_geometry_v1" app.js
          grep -F "answer itself is already recorded" app.js
          grep -F "map updating…" app.js
          grep -F "state.gameMap.fitBounds(L.geoJSON(state.mapData.city).getBounds()" app.js
          grep -F "state.createMap.fitBounds(L.geoJSON(state.mapData.city).getBounds()" app.js
          grep -F "serves the hiding station." app.js
          grep -F "Suggested answer: closest to" app.js
          grep -F "create or replace function public.attach_answer_geometry_v1" supabase-v3.13.3-migration.sql
          if grep -Fq "rec=await preparedForAnswer(q,variant)" app.js; then echo 'blocking pre-answer geometry still present'; exit 1; fi
          if grep -Fq "if(!restoreGameMapView())" app.js; then echo 'cached game map restore still used on entry'; exit 1; fi
          git diff --check
      - name: Show production diff
        run: git diff --stat origin/main -- app.js geometry-worker.js index.html supabase-v3.13.3-migration.sql
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js geometry-worker.js index.html supabase-v3.13.3-migration.sql
          git commit -m "v3.13.3: keep geometry work out of gameplay timing"
          git push origin HEAD:fix/v3.13.3-responsive-geometry
