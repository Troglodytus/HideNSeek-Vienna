name: Validate v3.13.6 VOR and Time Traps
on:
  push:
    branches: [feature/v3.13.6-live-vor-100m-traps]
    paths: [.github/v3136-test-trigger.txt]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v3.13.6-live-vor-100m-traps
          fetch-depth: 0
      - name: JavaScript syntax
        run: node --check app.js
      - name: Verify focused gameplay invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app.js').read_text()
          h=Path('index.html').read_text()
          m=Path('supabase-v3.13.6-migration.sql').read_text()
          assert "const APP_VERSION = '3.13.6';" in a
          assert 'const VOR_NAV_DURATION_SECONDS = 90;' in a
          assert "get_vor_navigation_bearing_v2" in a
          assert "p_player_id:playerId" in a
          assert "state.vorBearing=null; // No fresh GPS" in a
          assert "if(origin.source!=='gps')" in a
          assert "if(row&&Number.isFinite(Number(row.bearing_deg)))" in a
          assert "auto within 100 m" in a
          assert "get_vor_navigation_bearing_v2(p_game_id uuid,p_question_action_id uuid,p_player_id uuid)" in m
          assert "where s.game_id=p_game_id and s.player_id=p_player_id" in m
          assert "s.updated_at>=now()-interval '20 seconds'" in m
          assert "select h.lat,h.lng into v_target_lat,v_target_lng" in m
          assert "select hidden_lat,hidden_lng into v_target_lat,v_target_lng" in m
          assert "return query select v_bearing,v_expires" in m
          assert "least(90,greatest(30" in m
          assert "if v_dist<=100 then" in m
          assert "public._time_trap_value_v4" in m
          assert "triggered_by_player_id" in m
          assert "100 m" in m
          assert "id=\"vorNavigationTimer\">1:30" in h
          assert 'same_line_prepare' in a
          assert 'runGeometryWorker' in a
          assert 'geometry-worker.js' in a
          assert 'set_time_trap_trigger_v3' in a
          print('VOR per-viewer, 90s, automatic 100m traps, manual fallback, geometry preservation OK')
          PY
      - name: Whitespace check
        run: git diff --check HEAD~3 HEAD
