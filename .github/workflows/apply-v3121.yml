name: Apply v3.12.1 transit and same-line fix

on:
  push:
    branches:
      - fix/v3.12.1-transit-sameline
    paths:
      - .github/apply-v3121.py
      - .github/workflows/apply-v3121.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v3.12.1-transit-sameline
          fetch-depth: 0
      - name: Apply targeted patch
        run: python3 .github/apply-v3121.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Validate targeted invariants
        run: |
          grep -q "const APP_VERSION = '3.12.1'" app.js
          grep -q "bus geometry stays in transit tiles" app.js
          grep -q "referenceChunkRowsForTiles" app.js
          grep -q "bus_features:busFeatures" app.js
          grep -q "Only other-line corridors close enough" app.js
          grep -q "function reloadGameStateOnce" app.js
          if grep -q "Saving .*bus line segments" app.js; then exit 1; fi
          git diff --check
      - name: Commit application fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "v3.12.1: tile bus data and stabilize same-line no"
          git push origin HEAD:fix/v3.12.1-transit-sameline
