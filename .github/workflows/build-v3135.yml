name: Build v3.13.5 players and traps
on:
  push:
    branches: [feature/v3.13.5-players-rewards-traps]
    paths: [.github/v3135-trigger.txt]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v3.13.5-players-rewards-traps
      - name: Apply targeted patch
        run: python3 .github/v3135-patch.py
      - name: JavaScript syntax
        run: node --check app.js
      - name: Validate requested invariants
        run: |
          grep -F "const APP_VERSION = '3.13.5';" app.js
          grep -F "Unlocks after 4 questions" app.js
          grep -F "Hider reward · Draw" app.js
          grep -F "set_seeker_player_position_v1" app.js
          grep -F "get_seeker_player_positions_v1" app.js
          grep -F "player-location-marker" styles.css
          grep -F "developerPlayersTab" index.html
          grep -F "hiderCreatePlayerSelect" index.html
          grep -F "seekerPlayerSelect" index.html
          grep -F "ask_question_v5" supabase-v3.13.5-migration.sql
          grep -F "answer_question_v6" supabase-v3.13.5-migration.sql
          grep -F "updated_at>=now()-interval '20 seconds'" supabase-v3.13.5-migration.sql
          grep -F "v_dist<=50" supabase-v3.13.5-migration.sql
          grep -F "/600" supabase-v3.13.5-migration.sql
          grep -F "same_line_prepare" app.js
          grep -F "heavyAreaPending" app.js
          grep -F "geometry-worker.js" app.js
          ! grep -F "if(state.role==='seeker')renderQuestionDeck();" app.js
          git diff --check
      - name: Show production diff
        run: git diff --stat HEAD -- app.js index.html styles.css
      - name: Commit generated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css
          git commit -m "v3.13.5: players, transparent rewards and reliable traps"
          git push origin HEAD:feature/v3.13.5-players-rewards-traps
